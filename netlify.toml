[build]
  command = "npm run build"
  publish = "dist"

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Canonicalize trailing-slash variants to no-slash (consolidate URL split per
# Google Ads QS optimization 2026-05-08). Each variant was being scored
# separately by Google Ads' LP scorer, splitting authority across mirror URLs.
[[redirects]]
  from = "/ghost/"
  to = "/ghost"
  status = 301
  force = true

[[redirects]]
  from = "/ghost/custom/"
  to = "/ghost/custom"
  status = 301
  force = true

[[redirects]]
  from = "/ghost/finish-demo/"
  to = "/ghost/finish-demo"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
