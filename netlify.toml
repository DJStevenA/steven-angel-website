[build]
  command = "npm run build"
  publish = "dist"

[build.processing.html]
  # pretty_urls = false is intentional — matches our canonical convention
  # (no trailing slash; static SEO HTMLs at dist/<route>/index.html declare
  # canonical = /<route> with no slash). With pretty_urls = true, Netlify
  # auto-301'd /ghost → /ghost/ and /shop → /shop/ and /blog → /blog/ for
  # folders that contained an index.html, which contradicted the canonical
  # tag and split Google Ads landing-page metrics across two URLs. Restored
  # to false on 2026-05-17. DO NOT flip to true without checking that all
  # canonical tags + Google Ads landing pages still match the served URL.
  pretty_urls = false

# ────────────────────────────────────────────────────────────────────────────
# Security headers (added 2026-06-08, per UNPWNED security audit Score 70/100)
#
# Applied to every response. Caveats:
#   - CSP runs in REPORT-ONLY mode for the first deploy cycle to surface any
#     3rd-party that would get blocked (GTM, Clarity, PayPal, Airwallex, Brevo,
#     YouTube embeds, Cloudflare R2, Meta Pixel). After 48h of clean reports,
#     flip the header name from `Content-Security-Policy-Report-Only` to
#     `Content-Security-Policy` to actually enforce.
#   - HSTS is already served (kept as-is via Netlify default).
# ────────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=*, fullscreen=(self)"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.clarity.ms https://*.clarity.ms https://*.paypal.com https://*.paypalobjects.com https://www.paypal.com https://checkout.airwallex.com https://*.airwallex.com https://connect.facebook.net https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: ; media-src 'self' blob: https://ghost-backend-production-adb6.up.railway.app https://*.r2.cloudflarestorage.com https://*.r2.dev https://pub-*.r2.dev; connect-src 'self' https://ghost-backend-production-adb6.up.railway.app https://www.google-analytics.com https://*.analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://*.clarity.ms https://*.paypal.com https://*.airwallex.com https://api.airwallex.com https://api.brevo.com https://my.sendinblue.com https://connect.facebook.net https://www.facebook.com https://*.r2.cloudflarestorage.com https://*.r2.dev; frame-src 'self' https://www.youtube.com https://*.paypal.com https://*.airwallex.com https://td.doubleclick.net https://www.googletagmanager.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://*.paypal.com https://*.airwallex.com; upgrade-insecure-requests"

[[headers]]
  for = "/.well-known/apple-developer-merchantid-domain-association"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# History (2026-05-10 → 2026-05-17):
#   1. Tried adding explicit /ghost/ → /ghost 301 redirects to enforce the
#      no-slash canonical. That created an infinite loop because Netlify's
#      pretty-URL processing internally treats /ghost as /ghost/ when matching
#      file system folders, so force=true fired on /ghost too.
#   2. Removed the explicit redirects (b204b58) but LEFT pretty_urls = true.
#      That made Netlify auto-301 /ghost → /ghost/ for any path whose folder
#      contained an index.html — contradicting the canonical = /ghost tag in
#      the static HTML and splitting Google Ads landing-page quality metrics.
#   3. (2026-05-17, current) Restored pretty_urls = false. Both /ghost and
#      /ghost/ now serve dist/ghost/index.html directly with no redirect.
#      Canonical tag stays = /ghost. No redirect rules needed for this.

# Short product slug aliases → canonical SEO slug. Without these, sharing a
# short URL like /shop/balkan-boy falls back to the SPA index.html and the
# Facebook scraper sees the generic homepage OG tags instead of the product's.
[[redirects]]
  from = "/shop/afro-house-masterclass"
  to = "/shop/afro-house-masterclass-ableton-live-tutorial-jungle-walk"
  status = 301
  force = true

[[redirects]]
  from = "/shop/masterclass"
  to = "/shop/afro-house-masterclass-ableton-live-tutorial-jungle-walk"
  status = 301
  force = true

[[redirects]]
  from = "/shop/balkan-boy"
  to = "/shop/afro-house-balkan-ableton-live-template-balkan-boy"
  status = 301
  force = true

[[redirects]]
  from = "/shop/maria-maria"
  to = "/shop/afro-house-remix-ableton-live-template-maria-maria"
  status = 301
  force = true

[[redirects]]
  from = "/shop/el-barrio"
  to = "/shop/afro-house-ableton-live-template-el-barrio-mtgd"
  status = 301
  force = true

[[redirects]]
  from = "/shop/solomun-arabian"
  to = "/shop/melodic-techno-ableton-template-solomun-artbat-style"
  status = 301
  force = true

[[redirects]]
  from = "/shop/mega-bundle"
  to = "/shop/melodic-techno-afro-house-ableton-template-bundle"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
