[build]
  command = "npm run build"
  publish = "dist"

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Note (2026-05-10): the previous /ghost/ → /ghost 301 redirects created an
# infinite loop because Netlify's pretty-URL processing internally treats
# /ghost as /ghost/ when matching file system folders. force=true caused the
# rule to fire on /ghost as well, which then redirected to /ghost again.
# Solution: remove the redirects entirely. Both /ghost and /ghost/ serve the
# same content from dist/ghost/index.html. The canonical <link> tag in HTML
# tells Google /ghost is the canonical version, which is enough for SEO/QS.
# DO NOT add /ghost/* → /ghost-style redirects without testing for loops.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
