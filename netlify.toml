[build]
  command = "npm run build"
  publish = "dist"

[build.processing.html]
  # pretty_urls = false is intentional — matches our canonical convention
  # (no trailing slash; static SEO HTMLs at dist/<route>/index.html declare
  # canonical = /<route> with no slash). With pretty_urls = true, Netlify
  # auto-301'd /ghost → /ghost/ and /shop → /shop/ and /blog → /blog/ for
  # folders that contained an index.html, which contradicted the canonical
  # tag and split Google Ads landing-page metrics across two URLs. Restored
  # to false on 2026-05-17. DO NOT flip to true without checking that all
  # canonical tags + Google Ads landing pages still match the served URL.
  pretty_urls = false

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# History (2026-05-10 → 2026-05-17):
#   1. Tried adding explicit /ghost/ → /ghost 301 redirects to enforce the
#      no-slash canonical. That created an infinite loop because Netlify's
#      pretty-URL processing internally treats /ghost as /ghost/ when matching
#      file system folders, so force=true fired on /ghost too.
#   2. Removed the explicit redirects (b204b58) but LEFT pretty_urls = true.
#      That made Netlify auto-301 /ghost → /ghost/ for any path whose folder
#      contained an index.html — contradicting the canonical = /ghost tag in
#      the static HTML and splitting Google Ads landing-page quality metrics.
#   3. (2026-05-17, current) Restored pretty_urls = false. Both /ghost and
#      /ghost/ now serve dist/ghost/index.html directly with no redirect.
#      Canonical tag stays = /ghost. No redirect rules needed for this.

# Short product slug aliases → canonical SEO slug. Without these, sharing a
# short URL like /shop/balkan-boy falls back to the SPA index.html and the
# Facebook scraper sees the generic homepage OG tags instead of the product's.
[[redirects]]
  from = "/shop/afro-house-masterclass"
  to = "/shop/afro-house-masterclass-ableton-live-tutorial-jungle-walk"
  status = 301
  force = true

[[redirects]]
  from = "/shop/masterclass"
  to = "/shop/afro-house-masterclass-ableton-live-tutorial-jungle-walk"
  status = 301
  force = true

[[redirects]]
  from = "/shop/balkan-boy"
  to = "/shop/afro-house-balkan-ableton-live-template-balkan-boy"
  status = 301
  force = true

[[redirects]]
  from = "/shop/maria-maria"
  to = "/shop/afro-house-remix-ableton-live-template-maria-maria"
  status = 301
  force = true

[[redirects]]
  from = "/shop/el-barrio"
  to = "/shop/afro-house-ableton-live-template-el-barrio-mtgd"
  status = 301
  force = true

[[redirects]]
  from = "/shop/solomun-arabian"
  to = "/shop/melodic-techno-ableton-template-solomun-artbat-style"
  status = 301
  force = true

[[redirects]]
  from = "/shop/mega-bundle"
  to = "/shop/melodic-techno-afro-house-ableton-template-bundle"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
